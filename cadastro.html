<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Ocorrências - Pós-Sismo</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #12121f; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 450px; background: #1a1a2e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #ff5252; text-align: center; border-bottom: 1px solid #33334d; padding-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #b0b0d0; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; background: #252542; border: 1px solid #33334d; border-radius: 6px; color: #fff; font-size: 0.9rem; }
        button { width: 100%; background: #ff5252; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #ff3333; }
        .links { margin-top: 15px; text-align: center; }
        .links a { color: #00e676; text-decoration: none; font-size: 0.9rem; }
        .links a:hover { text-decoration: underline; }
        #mensagem { margin-top: 15px; text-align: center; font-size: 0.85rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Registar Nova Ocorrência</h2>
        <form id="form-ocorrencia">
            <div class="form-group">
                <label for="descricao">Descrição / Bairro:</label>
                <input type="text" id="descricao" required placeholder="Ex: Queda de muro - Bairro Cidade Jardim">
            </div>
            <div class="form-group">
                <label for="rua">Rua / Logradouro:</label>
                <input type="text" id="rua" placeholder="Ex: Av Maringá">
            </div>
            <div class="form-group">
                <label for="referencia">Ponto de Referência:</label>
                <input type="text" id="referencia" placeholder="Ex: Próximo à praça central">
            </div>
            <div class="form-group">
                <label for="severidade">Severidade:</label>
                <select id="severidade">
                    <option value="Baixa">Baixa</option>
                    <option value="Moderada">Moderada</option>
                    <option value="Alta">Alta</option>
                    <option value="Crítica">Crítica</option>
                </select>
            </div>
            <div class="form-group">
                <label for="horario">Horário do Evento:</label>
                <input type="text" id="horario">
            </div>
            <div class="form-group">
                <label for="lat">Latitude:</label>
                <input type="number" step="0.000001" id="lat" required value="-6.055461">
            </div>
            <div class="form-group">
                <label for="lon">Longitude:</label>
                <input type="number" step="0.000001" id="lon" required value="-49.846358">
            </div>
            <button type="submit">Cadastrar e Enviar ao Mapa</button>
        </form>
        <div id="mensagem"></div>
        <div class="links">
            <a href="/emergencia.html">&#8592; Voltar para o Painel Operacional no Mapa</a>
        </div>
    </div>

    <script>
        const agora = new Date();
        const dataFormatada = String(agora.getDate()).padStart(2, '0') + '/' + 
                              String(agora.getMonth() + 1).padStart(2, '0') + '/' + 
                              agora.getFullYear() + ' ' + 
                              String(agora.getHours()).padStart(2, '0') + ':' + 
                              String(agora.getMinutes()).padStart(2, '0');
        document.getElementById('horario').value = dataFormatada;

        document.getElementById('form-ocorrencia').onsubmit = async (e) => {
            e.preventDefault();
            const dados = {
                descricao: document.getElementById('descricao').value,
                rua: document.getElementById('rua').value,
                referencia: document.getElementById('referencia').value,
                severidade: document.getElementById('severidade').value,
                horario: document.getElementById('horario').value,
                lat: document.getElementById('lat').value,
                lon: document.getElementById('lon').value
            };

            try {
                const res = await fetch('/api/adicionar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                const msg = document.getElementById('mensagem');
                if (res.ok) {
                    msg.style.color = '#00e676';
                    msg.innerText = 'Ocorrência cadastrada com sucesso!';
                    document.getElementById('form-ocorrencia').reset();
                    document.getElementById('horario').value = dataFormatada;
                } else {
                    msg.style.color = '#ff5252';
                    msg.innerText = 'Erro ao registar ocorrência.';
                }
            } catch (err) {
                document.getElementById('mensagem').style.color = '#ff5252';
                document.getElementById('mensagem').innerText = 'Erro de conexão com o servidor.';
            }
        };
    </script>
</body>
</html>
