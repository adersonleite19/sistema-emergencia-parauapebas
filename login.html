<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de Emergência Pós-Sismo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #11111d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #1e1e2f;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #ff5252;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #a0a0b8;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #33334d;
            background: #2a2a40;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: #ff5252;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #ff3333;
        }
        .erro {
            color: #ff5252;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Defesa Civil</h2>
        <p style="font-size: 0.9rem; color: #a0a0b8; margin-bottom: 25px;">Painel de Resposta Pós-Sismo</p>
        
        <div class="form-group">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário">
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
        </div>

        <button onclick="fazerLogin()">Entrar no Sistema</button>
        <div id="erro-msg" class="erro">Usuário ou senha incorretos!</div>
    </div>

    <script>
        function fazerLogin() {
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('senha').value;

            // Credenciais padrão para acesso ao protótipo
            if (user === 'admin' && pass === '123') {
                window.location.href = 'emergencia.html';
            } else {
                document.getElementById('erro-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
